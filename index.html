<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D WebGL PoC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Dependencias de Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- PixiJS v6.5.10 (Recomendado para headless rendering y estabilidad WebGL) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <!-- Configurar PIXI global antes de cargar pixi-live2d-display -->
    <script>
        window.PIXI = PIXI;
    </script>
    <!-- pixi-live2d-display v0.4.x via bundle directo cubism4 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <script>
        // Inicializar la aplicación PixiJS
        const app = new PIXI.Application({
            view: document.createElement('canvas'),
            autoStart: true,
            resizeTo: window,
            backgroundColor: 0x333333,
            transparent: false
        });
        document.body.appendChild(app.view);

        // Asegurarnos de usar la clase Live2DModel correctamente desde PIXI.live2d
        const Live2DModel = PIXI.live2d.Live2DModel;

        async function loadModel() {
            try {
                // Codificar la URL porque la ruta contiene espacios y caracteres especiales
                const modelPath = encodeURI('sin 七大罪～魔王崇拜～/xch001_01/xch001_01.model3.json');

                // Cargar el modelo
                console.log("Cargando modelo desde:", modelPath);
                const model = await Live2DModel.from(modelPath);

                // Configurar el modelo y añadirlo al escenario
                app.stage.addChild(model);

                // Centrar y escalar
                const scaleX = innerWidth / model.internalModel.width;
                const scaleY = innerHeight / model.internalModel.height;
                // Mantener el ratio y dar un margen
                model.scale.set(Math.min(scaleX, scaleY) * 0.9);
                model.anchor.set(0.5, 0.5);
                model.position.set(innerWidth / 2, innerHeight / 2);

                // Tracking del cursor
                // pixi-live2d-display lo maneja automáticamente con punteros
                // Para animaciones en click/tap
                model.on('pointerdown', (hitAreas) => {
                    // Si toca cualquier parte o nada, dispara una animación al azar (en este caso el index 0 o 1)
                    const motionGroups = Object.keys(model.internalModel.motionManager.motionGroups || {});
                    if (motionGroups.length > 0) {
                        model.motion(motionGroups[0]);
                    } else {
                        // Intentar sin nombre de grupo
                        model.motion("");
                    }
                });

                window.addEventListener('resize', () => {
                    const scaleX = innerWidth / model.internalModel.width;
                    const scaleY = innerHeight / model.internalModel.height;
                    model.scale.set(Math.min(scaleX, scaleY) * 0.9);
                    model.position.set(innerWidth / 2, innerHeight / 2);
                });

                console.log("Modelo cargado exitosamente.");
            } catch (error) {
                console.error("Error cargando el modelo:", error);
            }
        }

        loadModel();
    </script>
</body>
</html>
