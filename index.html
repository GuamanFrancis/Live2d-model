<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D PoC - Arquitectura Avanzada</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- PixiJS v6.5.10 (Preferido para máxima compatibilidad WebGL/Headless) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- Live2D Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- Pixi Live2D Display (Bundle para Cubism 4) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // Inicialización de la aplicación Pixi
        const app = new PIXI.Application({
            view: document.createElement('canvas'),
            resizeTo: window,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1,
            backgroundColor: 0x2c3e50
        });

        document.getElementById('canvas-container').appendChild(app.view);

        // Variables globales para el modelo
        let currentModel = null;

        // Modelo a cargar (codificación correcta para caracteres especiales/asiáticos)
        const modelPath = encodeURI('sin 七大罪～魔王崇拜～/xch001_01/xch001_01.model3.json');

        async function initLive2D() {
            try {
                // Carga del modelo usando la factoría de pixi-live2d-display
                const model = await PIXI.live2d.Live2DModel.from(modelPath);
                currentModel = model;

                app.stage.addChild(model);

                // Función de redimensionamiento
                const resizeModel = () => {
                    // Usar las dimensiones internas sin escalar para evitar distorsiones
                    const scaleX = innerWidth / model.internalModel.width;
                    const scaleY = innerHeight / model.internalModel.height;

                    // Mantener el aspect ratio ajustándose a la dimensión menor para que encaje
                    model.scale.set(Math.min(scaleX, scaleY) * 0.8);

                    // Centrar
                    model.x = innerWidth / 2;
                    model.y = innerHeight / 2;

                    // Ajustar el punto de anclaje si es necesario, pero Live2DModels
                    // generalmente pivotan desde el centro o abajo. Lo reposicionaremos
                    // para centrar.
                    model.anchor.set(0.5, 0.5);
                };

                // Llamar inicialmente y escuchar redimensionamientos
                resizeModel();
                window.addEventListener('resize', resizeModel);

                // Implementación de Interacción: Seguimiento del cursor
                app.view.addEventListener('pointermove', (e) => {
                    if (model.internalModel && model.internalModel.focusController) {
                        // Normalizar coordenadas (-1 a 1) respecto al canvas
                        const rect = app.view.getBoundingClientRect();
                        const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                        const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;

                        // Focus espera valores normalizados
                        model.internalModel.focusController.focus(x, -y);
                    }
                });

                // Implementación de Interacción: Ejecución de animaciones (motions)
                app.view.addEventListener('pointerdown', (e) => {
                    // Seleccionar una animación aleatoria para demostrar la funcionalidad
                    const motionCount = 3; // En este modelo específico vimos touch1, idle, touch2
                    const randomMotion = Math.floor(Math.random() * motionCount);

                    // Trigger de la animación en el grupo por defecto ("")
                    model.motion('', randomMotion);
                    console.log(`Motion triggered: index ${randomMotion}`);
                });

                console.log("Live2D Modelo cargado correctamente.");
            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        }

        // Iniciar
        initLive2D();
    </script>
</body>
</html>
