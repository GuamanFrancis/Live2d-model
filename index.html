<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D WebGL PoC (PixiJS)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #loading {
            position: absolute;
            color: #ffffff;
            font-family: sans-serif;
            font-size: 1.2rem;
            z-index: 10;
        }
    </style>

    <!-- PixiJS 6.5.10 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>

    <!-- Live2D Cubism Core (SDK 4) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- pixi-live2d-display -->
    <!-- Expose PIXI globally for the plugin -->
    <script>window.PIXI = PIXI;</script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="loading">Cargando modelo Live2D...</div>
    <canvas id="canvas"></canvas>

    <script>
        // Init PixiJS Application
        const app = new PIXI.Application({
            view: document.getElementById('canvas'),
            autoStart: true,
            resizeTo: window,
            backgroundColor: 0x1a1a1a,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });

        async function initLive2D() {
            try {
                // Ensure correct URL encoding for directories with spaces or asian characters
                const rawModelPath = "sin 七大罪～魔王崇拜～/xch001_01/xch001_01.model3.json";
                const modelUrl = encodeURI(rawModelPath);

                // Initialize the Live2D model instance
                const model = await PIXI.live2d.Live2DModel.from(modelUrl);

                // Remove loading text
                document.getElementById('loading').style.display = 'none';

                // Add model to the stage
                app.stage.addChild(model);

                // Setup transformations
                // Center the anchor point for easier positioning and scaling
                model.anchor.set(0.5, 0.5);

                function resize() {
                    // Position at the center of the screen
                    model.x = app.renderer.width / 2;
                    model.y = app.renderer.height / 2;

                    // Calculate a scale based on internal dimensions to avoid distortion
                    const scaleX = (app.renderer.width * 0.8) / model.internalModel.width;
                    const scaleY = (app.renderer.height * 0.8) / model.internalModel.height;
                    const scale = Math.min(scaleX, scaleY);

                    model.scale.set(scale);
                }

                // Initial layout
                resize();

                // Handle window resize dynamically
                window.addEventListener('resize', resize);

                // Setup Interaction (Motions & Event listeners)
                model.interactive = true;
                model.buttonMode = true;

                // Motion cycle index
                let motionIndex = 0;

                model.on('pointerdown', (event) => {
                    // Start a motion from the default group (empty string "")
                    // We increment index to cycle through available animations
                    // touch1, idle, touch2, etc. (Based on model3.json inspection)
                    model.motion('', motionIndex);

                    motionIndex++;
                    // Basic reset fallback if we hit bounds (assuming 3 motions based on previous cat)
                    if(motionIndex > 2) motionIndex = 0;
                });

                // Eye tracking / Head tracking is handled automatically
                // by pixi-live2d-display via internalModel.focusController
                // No manual mapping needed.

            } catch (error) {
                console.error("Error al inicializar Live2D:", error);
                document.getElementById('loading').innerText = "Error cargando el modelo. Revisa la consola.";
                document.getElementById('loading').style.color = "red";
            }
        }

        // Bootstrap
        initLive2D();
    </script>
</body>
</html>
