<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Live2D Model PoC - Siete Pecados</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #333; }
        canvas { display: block; }
    </style>
    <!-- PixiJS v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <!-- Cubism Core SDK -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display (Cubism 4 Bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Ensure PIXI is globally available
        window.PIXI = PIXI;

        const { Live2DModel } = PIXI.live2d;

        (async function main() {
            // Setup Pixi Application
            const app = new PIXI.Application({
                view: document.getElementById('canvas'),
                autoStart: true,
                resizeTo: window,
                backgroundColor: 0x333333
            });

            // Model file path encoded to handle spaces and Asian characters
            const modelUrl = encodeURI('sin 七大罪～魔王崇拜～/xch001_01/xch001_01.model3.json');

            try {
                // Initialize the Live2D model
                const model = await Live2DModel.from(modelUrl);

                app.stage.addChild(model);

                // Initial positioning and scaling based on unscaled dimensions
                function resize() {
                    const scaleX = innerWidth / model.internalModel.width;
                    const scaleY = innerHeight / model.internalModel.height;

                    // Fit to screen, maintain aspect ratio
                    model.scale.set(Math.min(scaleX, scaleY) * 0.9);
                    model.x = innerWidth / 2;
                    model.y = innerHeight / 2;

                    // Center the model's anchor point
                    if(model.anchor) {
                        model.anchor.set(0.5, 0.5);
                    }
                }

                // Handle resize
                window.addEventListener('resize', resize);
                resize();

                // Setup Interaction (Eye/Head tracking is automatic)
                model.interactive = true;
                model.buttonMode = true;

                // Motion on click
                model.on('pointertap', () => {
                    // Trigger a random motion from the default group (empty string '')
                    model.motion('', Math.floor(Math.random() * 3));
                    console.log('Motion triggered on click');
                });

                console.log('Model loaded successfully!');
            } catch(e) {
                console.error("Error loading Live2D model:", e);
            }
        })();
    </script>
</body>
</html>
