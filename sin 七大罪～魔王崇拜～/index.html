<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D PoC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Core library for PixiJS (6.x version required) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- Cubism Core SDK -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- pixi-live2d-display (Cubism 4 support bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <script>
        // Use pixi-live2d-display module
        const { Live2DModel } = PIXI.live2d;

        (async function main() {
            // Create Pixi Application
            const app = new PIXI.Application({
                view: document.createElement('canvas'),
                autoStart: true,
                resizeTo: window,
                backgroundColor: 0x333333,
            });
            document.body.appendChild(app.view);

            // Path to the .model3.json file
            // Note: URI encoding is important to handle spaces/Asian characters in paths
            const modelPath = encodeURI('xch001_01/xch001_01.model3.json');

            try {
                // Load the model
                const model = await Live2DModel.from(modelPath);

                // Add it to the stage
                app.stage.addChild(model);

                // Calculate scaling based on original model internal dimensions vs screen size
                const scaleX = window.innerWidth / model.internalModel.width;
                const scaleY = window.innerHeight / model.internalModel.height;

                // Fit nicely on screen
                model.scale.set(Math.min(scaleX, scaleY) * 0.8);

                // Center the model
                model.x = (window.innerWidth - model.width) / 2;
                model.y = (window.innerHeight - model.height) / 2;

                // Handle window resize
                window.addEventListener('resize', () => {
                    const sx = window.innerWidth / model.internalModel.width;
                    const sy = window.innerHeight / model.internalModel.height;
                    model.scale.set(Math.min(sx, sy) * 0.8);
                    model.x = (window.innerWidth - model.width) / 2;
                    model.y = (window.innerHeight - model.height) / 2;
                });

                // Interaction: Eye/Head Tracking
                // We track mouse movement globally using pointermove
                app.view.addEventListener('pointermove', (event) => {
                    // Coordinates relative to canvas
                    const rect = app.view.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    model.focus(x, y);
                });

                // Interaction: Play animations on click
                app.view.addEventListener('pointerdown', () => {
                    // Play a random motion from the default group (usually '')
                    model.motion('');
                });

                console.log("Model loaded successfully");

            } catch (error) {
                console.error("Failed to load the model:", error);
            }
        })();
    </script>
</body>
</html>
