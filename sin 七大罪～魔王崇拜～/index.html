<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Model PoC - Arquitectura de Carga</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>

    <!-- PixiJS (usando v6.x en lugar de v5.x para mejorar la compatibilidad webgl en headless/swiftshader) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script>
        // Exponer PIXI globalmente para que pixi-live2d-display lo reconozca
        window.PIXI = PIXI;
    </script>

    <!-- Cubism Core (oficial) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- pixi-live2d-display (usamos cubism4.min.js para soporte directo de .model3.json y SDK 4) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

</head>
<body>

<div id="canvas-container">
    <canvas id="live2d-canvas"></canvas>
</div>

<script>
    (async function main() {
        try {
            console.log("Inicializando aplicación PixiJS...");
            // Inicializar la aplicación PixiJS
            const app = new PIXI.Application({
                view: document.getElementById('live2d-canvas'),
                autoStart: true,
                resizeTo: window,
                backgroundColor: 0x2c3e50,
                resolution: window.devicePixelRatio || 1,
            });

            // Registrar el modelo Live2D a cargar
            // El modelo xch001_01 usa Live2D Cubism SDK 4 (.model3.json)
            const modelUrl = 'xch001_01/xch001_01.model3.json';

            console.log("Cargando el modelo Live2D desde:", modelUrl);

            // Cargar el modelo de forma asíncrona usando pixi-live2d-display
            const model = await PIXI.live2d.Live2DModel.from(modelUrl);

            // Añadir el modelo a la escena (Stage) de PixiJS
            app.stage.addChild(model);

            // Escalar el modelo: el tamaño interno base está en model.internalModel.width / height
            const scaleX = innerWidth / model.internalModel.width;
            const scaleY = innerHeight / model.internalModel.height;
            // Elegimos la escala mínima para asegurarnos de que quepa en la pantalla
            const scale = Math.min(scaleX, scaleY) * 0.9;
            model.scale.set(scale);

            // Centrar la posición ancla del modelo para posicionarlo fácilmente en el centro de la pantalla
            model.anchor.set(0.5, 0.5);

            // Posicionar el modelo en el centro exacto
            model.position.set(innerWidth / 2, innerHeight / 2);

            // Hacer que el modelo sea interactivo para capturar clics (pointer events)
            model.interactive = true;
            model.buttonMode = true;

            // Escuchar el evento pointerdown para disparar una animación ("motion")
            model.on('pointerdown', () => {
                console.log("Detectado click en el modelo. Ejecutando animación aleatoria.");
                // pixi-live2d-display provee el método .motion() que dispara una animación
                // Al pasar un string vacío "", selecciona del grupo default definido en .model3.json (ej: "touch1", "idle")
                model.motion('', undefined, PIXI.live2d.MotionPriority.FORCE);
            });

            // Manejo del evento resize de ventana
            window.addEventListener('resize', () => {
                const newScaleX = innerWidth / model.internalModel.width;
                const newScaleY = innerHeight / model.internalModel.height;
                const newScale = Math.min(newScaleX, newScaleY) * 0.9;
                model.scale.set(newScale);
                model.position.set(innerWidth / 2, innerHeight / 2);
            });

            console.log("Modelo Live2D renderizado e interactivo.");

        } catch (error) {
            console.error("Error cargando el modelo Live2D:", error);
        }
    })();
</script>

</body>
</html>
