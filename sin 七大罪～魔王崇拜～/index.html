<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D PoC - SDK 4.0+</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Dependencias de Live2D y PixiJS -->
    <!-- live2dcubismcore es requerido para cargar modelos de SDK 4.0 -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- PixiJS v6 es recomendado para evitar problemas de WebGL no soportado en entornos headless -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <!-- Usar el bundle cubism4.min.js para modelos SDK 4.0+ -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        // Inicializar la aplicación PixiJS
        const app = new PIXI.Application({
            view: document.getElementById('canvas'),
            autoStart: true,
            resizeTo: window,
            backgroundColor: 0x333333
        });

        const { Live2DModel } = PIXI.live2d;

        async function loadModel() {
            try {
                // Ruta al archivo de modelo
                // Si la URL contuviera espacios, convendría usar encodeURI()
                const modelUrl = "xch001_01/xch001_01.model3.json";

                // Cargar el modelo
                const model = await Live2DModel.from(modelUrl);

                app.stage.addChild(model);

                // Ajustar el tamaño del modelo a la pantalla
                function resizeModel() {
                    // Usamos internalModel.width/height en lugar de model.width/height
                    // para evitar distorsiones al redimensionar la ventana.
                    const scaleX = window.innerWidth / model.internalModel.width;
                    const scaleY = window.innerHeight / model.internalModel.height;

                    // Ajustar escala manteniendo la proporción
                    const scale = Math.min(scaleX, scaleY) * 0.9;
                    model.scale.set(scale);

                    // Centrar el modelo
                    model.x = (window.innerWidth - model.internalModel.width * scale) / 2;
                    model.y = (window.innerHeight - model.internalModel.height * scale) / 2;
                }

                resizeModel();
                window.addEventListener('resize', resizeModel);

                // Configurar interacciones
                // El seguimiento de cursor (eye/head tracking) es gestionado automáticamente por pixi-live2d-display.
                model.interactive = true;
                model.buttonMode = true;

                let currentMotionIndex = 0;

                // Disparar animaciones ("motions") al hacer clic
                model.on('pointerdown', () => {
                    // En este caso disparamos animaciones del grupo por defecto ('').
                    // Cambiamos el índice para ciclar por las animaciones.
                    console.log("Triggering motion index", currentMotionIndex);
                    model.motion('', currentMotionIndex);

                    // Incrementamos el índice, asumimos unas 3 animaciones para la prueba (touch1, idle, touch2)
                    currentMotionIndex = (currentMotionIndex + 1) % 3;
                });

                console.log("Modelo Live2D cargado y renderizado exitosamente.");
            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        }

        loadModel();
    </script>
</body>
</html>
