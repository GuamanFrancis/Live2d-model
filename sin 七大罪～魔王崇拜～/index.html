<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- PixiJS v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>
    <!-- Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display (Cubism 4 bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <script>
        // Expose PIXI to window para pixi-live2d-display
        window.PIXI = PIXI;

        (async function main() {
            // Setup PixiJS application
            const app = new PIXI.Application({
                autoStart: true,
                resizeTo: window,
                backgroundColor: 0x333333
            });
            document.body.appendChild(app.view);

            // Path del modelo (usamos xch001_01 como ejemplo)
            const modelPath = encodeURI("xch001_01/xch001_01.model3.json");

            try {
                // Cargar el modelo Live2D
                const model = await PIXI.live2d.Live2DModel.from(modelPath);

                // Añadir el modelo al stage
                app.stage.addChild(model);

                // Escalar y posicionar el modelo
                const scaleX = innerWidth / model.internalModel.width;
                const scaleY = innerHeight / model.internalModel.height;
                model.scale.set(Math.min(scaleX, scaleY) * 0.8);

                model.anchor.set(0.5, 0.5);
                model.position.set(innerWidth / 2, innerHeight / 2);

                // Activar interacciones (como click y cursor tracking)
                // El eye/head tracking al mover el ratón ya viene activo por defecto
                model.interactive = true;
                model.buttonMode = true;

                // Evento click para disparar animaciones
                model.on('pointerdown', () => {
                    // Ejecuta una animación aleatoria del grupo por defecto ("")
                    model.motion('', Math.floor(Math.random() * 3));
                });

                // Reposicionar al cambiar tamaño de ventana
                window.addEventListener('resize', () => {
                    const newScaleX = innerWidth / model.internalModel.width;
                    const newScaleY = innerHeight / model.internalModel.height;
                    model.scale.set(Math.min(newScaleX, newScaleY) * 0.8);
                    model.position.set(innerWidth / 2, innerHeight / 2);
                });

                console.log("Modelo Live2D cargado exitosamente.");

            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        })();
    </script>
</body>
</html>
