<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Model Viewer - PoC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333; /* Dark background to contrast the model */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- PixiJS v6.5.10 -->

    <!-- Cubism Core -->

    <!-- pixi-live2d-display (cubism4 bundle) -->

</head>
<body>
    <script src="app.js"></script>
</body>
</html>
