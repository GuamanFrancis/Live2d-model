<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #loading {
            position: absolute;
            color: white;
            font-family: sans-serif;
            font-size: 1.5rem;
        }
    </style>
    <!-- Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- PixiJS 6.x -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- Expose PIXI globally -->
    <script>
        window.PIXI = PIXI;
    </script>

    <!-- pixi-live2d-display (Cubism 4 support) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="loading">Cargando modelo...</div>
    <div id="canvas-container"></div>

    <script>
        (async function main() {
            try {
                // Initialize PixiJS App
                const app = new PIXI.Application({
                    view: document.createElement('canvas'),
                    resizeTo: window,
                    transparent: true,
                    autoDensity: true,
                    resolution: window.devicePixelRatio || 1
                });
                document.getElementById('canvas-container').appendChild(app.view);

                // Path to the model
                const modelPath = encodeURI("xch001_01/xch001_01.model3.json");

                // Load the Live2D Model
                const model = await PIXI.live2d.Live2DModel.from(modelPath);

                // Add to stage
                app.stage.addChild(model);

                // Centering and scaling
                model.anchor.set(0.5, 0.5);

                const resize = () => {
                    model.x = app.screen.width / 2;
                    model.y = app.screen.height / 2 + 150; // offset slightly downwards

                    const scaleX = (app.screen.width * 0.8) / model.internalModel.width;
                    const scaleY = (app.screen.height * 0.8) / model.internalModel.height;
                    const scale = Math.min(scaleX, scaleY);

                    model.scale.set(scale);
                };

                resize();
                window.addEventListener('resize', resize);

                // Interaction Setup
                model.interactive = true;
                model.buttonMode = true;

                // Play motion on click
                model.on('pointertap', () => {
                    // Triggers the next animation in the default "" group randomly
                    model.motion('', undefined, PIXI.live2d.MotionPriority.FORCE);
                });

                document.getElementById('loading').style.display = 'none';
                console.log('Modelo cargado correctamente');
            } catch (error) {
                console.error("Error al cargar el modelo:", error);
                document.getElementById('loading').innerText = 'Error al cargar el modelo. Ver consola.';
            }
        })();
    </script>
</body>
</html>
