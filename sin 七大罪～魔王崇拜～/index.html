<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Model PoC - Arquitectura Senior</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50; /* Fondo oscuro profesional */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- 1. PixiJS (v6.x recomendado para entornos robustos y soporte WebGL en headless/SwiftShader) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- 2. Cubism Core (Requisito para SDK 4.0+) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- 3. pixi-live2d-display (Bundle específico para Cubism 4) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <script>
        // Exponer PIXI globalmente para que pixi-live2d-display lo detecte correctamente
        window.PIXI = PIXI;

        document.addEventListener('DOMContentLoaded', async () => {
            // Inicializar la aplicación PixiJS
            const app = new PIXI.Application({
                view: document.createElement('canvas'),
                resizeTo: window,
                autoStart: true,
                backgroundAlpha: 0 // Transparente para usar el fondo CSS
            });
            document.getElementById('canvas-container').appendChild(app.view);

            // Ruta al modelo (usando encodeURI para soportar caracteres especiales/asiáticos)
            // Escogemos el primer modelo xch001_01 como PoC
            const modelPath = encodeURI('xch001_01/xch001_01.model3.json');

            try {
                // Cargar el modelo Live2D
                const model = await PIXI.live2d.Live2DModel.from(modelPath);

                // Configurar anclaje para facilitar el posicionamiento centrado
                model.anchor.set(0.5, 0.5);

                // Función para ajustar el tamaño y la posición en respuesta a cambios en la ventana
                const resizeModel = () => {
                    const scaleX = app.renderer.width / model.internalModel.width;
                    const scaleY = app.renderer.height / model.internalModel.height;

                    // Escalar el modelo manteniendo la proporción para que encaje (un poco de margen)
                    const scale = Math.min(scaleX, scaleY) * 0.9;
                    model.scale.set(scale);

                    // Posicionar en el centro de la pantalla
                    model.x = app.renderer.width / 2;
                    model.y = app.renderer.height / 2;
                };

                // Habilitar interacción (para seguimiento del cursor y clicks)
                model.interactive = true;
                model.buttonMode = true;

                // Evento para disparar "motions" al hacer click
                // El seguimiento visual (eye/head tracking) es gestionado automáticamente por la librería
                model.on('pointerdown', () => {
                    // Dispara una animación aleatoria del grupo por defecto ('')
                    model.motion('', undefined, PIXI.live2d.MotionPrecedence.FORCE);
                });

                // Añadir el modelo al stage
                app.stage.addChild(model);

                // Ajustar al tamaño inicial y escuchar redimensionamientos
                resizeModel();
                window.addEventListener('resize', resizeModel);

                console.log("Modelo Live2D cargado exitosamente.");

            } catch (error) {
                console.error("Error cargando el modelo Live2D:", error);
            }
        });
    </script>
</body>
</html>
