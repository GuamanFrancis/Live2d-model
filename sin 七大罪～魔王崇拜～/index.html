<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Model PoC - sin 七大罪～魔王崇拜～</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
        }
    </style>
    <!-- PixiJS v6.5.10 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script>
        // Expose PIXI globally for pixi-live2d-display
        window.PIXI = PIXI;
    </script>
    <!-- Live2D Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display (Cubism 4 bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <h2>Live2D SDK 4.0+ PoC</h2>
        <p>Modelo: xch001_01</p>
        <p>Interactúa: El modelo sigue el cursor. Haz clic en el modelo para reproducir animaciones aleatorias.</p>
    </div>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
