<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC - PixiJS</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 2;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
        }

        h1 {
            font-size: 1.2rem;
            margin: 0 0 5px 0;
        }

        p {
            font-size: 0.9rem;
            margin: 0;
            color: #cccccc;
        }
    </style>
    <!-- Dependencias de PixiJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/5.3.3/pixi.min.js"></script>

    <!-- Dependencias de Cubism 4 Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- pixi-live2d-display (Bundle específico para Cubism 4+) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <h1>Live2D Viewer - PoC</h1>
        <p>Interactúa con el modelo moviendo el cursor o haciendo clic.</p>
    </div>

    <canvas id="canvas-container"></canvas>

    <script>
        // Inicializar la aplicación PixiJS
        const app = new PIXI.Application({
            view: document.getElementById('canvas-container'),
            autoStart: true,
            resizeTo: window,
            backgroundColor: 0x2b2b2b,
            resolution: window.devicePixelRatio || 1,
            autoDensity: true
        });

        const PIXI_LIVE2D = PIXI.live2d;

        async function initLive2D() {
            try {
                // Ruta al modelo.
                const modelUrl = 'xch001_01/xch001_01.model3.json';

                // Cargar el modelo
                const model = await PIXI_LIVE2D.Live2DModel.from(modelUrl);

                app.stage.addChild(model);

                // Función de redimensionamiento profesional asegurando que no haya distorsión
                function resizeModel() {
                    const scaleX = window.innerWidth / model.internalModel.width;
                    const scaleY = window.innerHeight / model.internalModel.height;

                    // Mantener el ratio de aspecto seleccionando el factor mínimo
                    const scale = Math.min(scaleX, scaleY) * 0.9; // 0.9 para un pequeño margen

                    model.scale.set(scale);

                    // Centrar el modelo
                    model.x = (window.innerWidth - model.internalModel.width * scale) / 2;
                    model.y = (window.innerHeight - model.internalModel.height * scale) / 2;
                }

                // Ajustar tamaño al cargar
                resizeModel();

                // Añadir listener para redimensionar la ventana
                window.addEventListener('resize', resizeModel);

                // Interacciones
                model.interactive = true;
                model.buttonMode = true;

                // Seguimiento del cursor
                model.on('pointermove', (event) => {
                    model.focus(event.data.global.x, event.data.global.y);
                });

                // Tocar/Hacer click para animaciones
                model.on('pointertap', (event) => {
                    // Triggers the 'tap_body' motion if configured, or hit areas
                    model.tap(event.data.global.x, event.data.global.y);
                });

                console.log("Modelo cargado exitosamente.");
            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        }

        initLive2D();
    </script>
</body>
</html>
