<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Live2D - SDK 4.0+</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            /* El canvas tomará el 100% de la pantalla mediante código,
               pero aseguramos que no haya márgenes por defecto */
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }
        .hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div id="loading">Cargando Modelo Live2D...</div>
    <div id="canvas-container">
        <!-- PixiJS Canvas se inyectará aquí -->
    </div>

    <!-- 1. Motor de renderizado PixiJS -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.2/dist/browser/pixi.min.js"></script>

    <!-- 2. Cubism Core para SDK 4.0+ -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- 3. Integración PixiJS + Live2D (Bundle específico para Cubism 4) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

    <!-- 4. Lógica de Aplicación -->
    <script src="app.js"></script>

</body>
</html>
