<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Core Live2D SDK -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- PixiJS (v6 is recommended for headless Playwright compatibility) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <!-- Exportar PIXI globalmente para el plugin -->
    <script>
        window.PIXI = PIXI;
    </script>
    <!-- pixi-live2d-display (Cubism 4 bundle, URL base sin versiones beta) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        (async function main() {
            // Inicializar la aplicación PixiJS
            const app = new PIXI.Application({
                view: document.getElementById('canvas'),
                autoStart: true,
                resizeTo: window,
                backgroundColor: 0x2c3e50
            });

            // Codificar la URL por seguridad (manejo de caracteres especiales/espacios)
            const modelUrl = encodeURI("xch001_01/xch001_01.model3.json");

            try {
                // Cargar el modelo Live2D
                const model = await PIXI.live2d.Live2DModel.from(modelUrl);

                // Configurar anclaje al centro para facilitar el posicionamiento
                model.anchor.set(0.5, 0.5);

                // Función de redimensionamiento responsivo
                function resize() {
                    // Dimensiones reales internas (no escaladas)
                    const modelWidth = model.internalModel.width;
                    const modelHeight = model.internalModel.height;

                    const scaleX = window.innerWidth / modelWidth;
                    const scaleY = window.innerHeight / modelHeight;

                    // Escalar preservando aspecto (ocupando un 90% de la pantalla)
                    const scale = Math.min(scaleX, scaleY) * 0.9;
                    model.scale.set(scale);

                    // Centrar
                    model.x = window.innerWidth / 2;
                    model.y = window.innerHeight / 2 + (modelHeight * scale * 0.1);
                }

                resize();
                window.addEventListener('resize', resize);

                // Habilitar eventos de puntero (clicks/taps)
                model.interactive = true;
                model.buttonMode = true;

                // Sistema básico de ejecución de "motions" (animaciones)
                let currentMotion = 0;
                model.on('pointerdown', () => {
                    // El JSON analizado tiene las animaciones bajo el grupo "" (vacío)
                    // Ciclar a través de los índices
                    model.motion('', currentMotion);
                    currentMotion = (currentMotion + 1) % 3; // 3 animaciones disponibles
                });

                app.stage.addChild(model);
                console.log("Modelo Live2D cargado con éxito.");

            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        })();
    </script>
</body>
</html>
