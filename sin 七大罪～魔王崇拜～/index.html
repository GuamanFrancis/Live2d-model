<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #canvas-container {
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
        #controls {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            width: 100%;
            text-align: center;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 0 10px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

    <!-- Cubism Core for SDK 4.0+ -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- PixiJS v6.x -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>

    <!-- Expose PIXI globally for pixi-live2d-display -->
    <script>
        window.PIXI = PIXI;
    </script>

    <!-- pixi-live2d-display (cubism4 bundle) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="live2d-canvas"></canvas>
    </div>
    <div id="controls">
        <button onclick="playMotion(0)">Touch 1</button>
        <button onclick="playMotion(1)">Idle</button>
        <button onclick="playMotion(2)">Touch 2</button>
    </div>

    <script>
        // Inicializar la aplicación Pixi
        const app = new PIXI.Application({
            view: document.getElementById('live2d-canvas'),
            autoStart: true,
            resizeTo: document.getElementById('canvas-container'),
            backgroundColor: 0x333333,
            resolution: window.devicePixelRatio || 1
        });

        let currentModel = null;

        async function initLive2D() {
            try {
                const modelPath = 'xch001_01/xch001_01.model3.json';

                // Cargar el modelo
                currentModel = await PIXI.live2d.Live2DModel.from(modelPath, { autoUpdate: true });

                app.stage.addChild(currentModel);

                // Configurar escala y posición inicial
                resizeModel();

                // Manejar redimensionamiento
                window.addEventListener('resize', resizeModel);

                console.log("Modelo Live2D cargado con éxito.");
            } catch (error) {
                console.error("Error al cargar el modelo Live2D:", error);
            }
        }

        function resizeModel() {
            if (!currentModel) return;

            const canvasWidth = app.renderer.width / app.renderer.resolution;
            const canvasHeight = app.renderer.height / app.renderer.resolution;

            // Usar dimensiones internas no escaladas
            const modelWidth = currentModel.internalModel.width;
            const modelHeight = currentModel.internalModel.height;

            const scaleX = canvasWidth / modelWidth;
            const scaleY = canvasHeight / modelHeight;

            // Mantener la relación de aspecto
            const scale = Math.min(scaleX, scaleY) * 0.9; // 90% del tamaño disponible para dar margen

            currentModel.scale.set(scale);

            // Centrar el modelo
            currentModel.x = (canvasWidth - modelWidth * scale) / 2;
            currentModel.y = (canvasHeight - modelHeight * scale) / 2;
        }

        // Función para reproducir animaciones
        function playMotion(index) {
            if (currentModel) {
                // El grupo base de animaciones a menudo no tiene nombre en estos JSON ("")
                currentModel.motion('', index);
                console.log(`Reproduciendo animación índice: ${index}`);
            }
        }

        // Iniciar carga
        initLive2D();
    </script>
</body>
</html>
