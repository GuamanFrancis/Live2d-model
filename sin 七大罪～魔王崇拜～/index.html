<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Web Render PoC</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #2c3e50; /* Un fondo neutro y profesional */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <!-- Scripts necesarios para PixiJS y Live2D (Cubism 4+) -->
    <!-- 1. PixiJS (Versión 6 recomendada para compatibilidad y estabilidad WebGL) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- 2. Exponer PIXI globalmente (Requisito para pixi-live2d-display) -->
    <script>
        window.PIXI = PIXI;
    </script>

    <!-- 3. Cubism Core (Requisito para modelos Cubism 3 y 4) -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- 4. pixi-live2d-display (Versión para Cubism 4, evitando tags beta específicos para prevenir errores) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

    <script>
        // Inicialización principal
        (async function init() {
            try {
                // 1. Configuración de la aplicación PixiJS
                const canvas = document.getElementById('live2d-canvas');
                const app = new PIXI.Application({
                    view: canvas,
                    resizeTo: window, // Auto-ajuste a la ventana
                    autoStart: true,
                    backgroundAlpha: 0 // Fondo transparente para integrar con el body
                });

                // 2. Ruta al modelo (Asegurar que los caracteres especiales estén codificados si se acceden por URL directa)
                // Utilizamos el modelo solicitado.
                const modelUrl = 'xch001_01/xch001_01.model3.json';

                // 3. Cargar el modelo
                console.log("Cargando modelo...");
                const { Live2DModel } = PIXI.live2d;
                const model = await Live2DModel.from(modelUrl);

                // 4. Configurar la posición y escala del modelo
                app.stage.addChild(model);

                // Centrar el anchor del modelo
                model.anchor.set(0.5, 0.5);

                function resizeModel() {
                    // Posicionarlo en el centro de la pantalla
                    model.x = app.screen.width / 2;
                    model.y = app.screen.height / 2;

                    // Escalar proporcionalmente basado en las dimensiones internas para evitar distorsión
                    const scaleX = app.screen.width / model.internalModel.width;
                    const scaleY = app.screen.height / model.internalModel.height;

                    // Usar un factor razonable, por ejemplo para ajustarlo al 80% de la altura
                    const scale = Math.min(scaleX, scaleY) * 0.8;
                    model.scale.set(scale, scale);
                }

                resizeModel();
                window.addEventListener('resize', resizeModel);

                // 5. Configurar Interacción (Cursor tracking y Click para Motions)
                model.interactive = true;
                model.buttonMode = true;

                // El seguimiento del cursor (eye/head tracking) es automático en pixi-live2d-display.
                // Al presionar el modelo, reproducimos una animación si existe.
                model.on('pointertap', () => {
                    console.log("Interacción detectada. Disparando animación.");
                    // 'motion' intenta ejecutar una animación en un grupo dado.
                    // Pasando cadena vacía intenta ejecutar una animación aleatoria disponible.
                    model.motion('', 0);
                });

                console.log("Modelo cargado exitosamente.");

            } catch (error) {
                console.error("Error al inicializar el modelo Live2D:", error);
            }
        })();
    </script>
</body>
</html>
