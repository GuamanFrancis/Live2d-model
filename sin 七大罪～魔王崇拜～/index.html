<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D Model Viewer PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- PixiJS (Version 6 recommended for Playwright SwiftShader compatibility) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <!-- Cubism Core for SDK 4.0+ -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>

    <!-- Pixi Live2D Display (Using unversioned base URL as recommended) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>

    <script>
        // Ensure PIXI is globally available for the Live2D plugin
        window.PIXI = PIXI;

        async function init() {
            // Setup PixiJS Application
            const app = new PIXI.Application({
                view: document.createElement('canvas'),
                resizeTo: window,
                autoStart: true,
                backgroundColor: 0x2c3e50,
                resolution: window.devicePixelRatio || 1,
            });
            document.getElementById('canvas-container').appendChild(app.view);

            // Path to the model (Properly encoded just in case)
            const modelUrl = encodeURI("xch001_01/xch001_01.model3.json");

            try {
                // Load the Live2D Model
                const model = await PIXI.live2d.Live2DModel.from(modelUrl);

                // Add to stage
                app.stage.addChild(model);

                // Positioning and Scaling
                // Centering the anchor simplifies positioning
                model.anchor.set(0.5, 0.5);

                function resize() {
                    model.x = app.screen.width / 2;
                    model.y = app.screen.height / 2;

                    // Fit model on screen based on unscaled dimensions to avoid distortion
                    const scaleX = app.screen.width / model.internalModel.width;
                    const scaleY = app.screen.height / model.internalModel.height;

                    // Fit within window, maintaining aspect ratio
                    model.scale.set(Math.min(scaleX, scaleY) * 0.9);
                }

                window.addEventListener('resize', resize);
                resize();

                // Interactivity (Click for animations)
                model.interactive = true;
                model.buttonMode = true;

                // Listen for pointer interactions
                model.on('pointerdown', () => {
                    // Trigger a random motion. Empty string signifies the default/unnamed group in the model3.json
                    const motionGroup = "";
                    const motionCount = model.internalModel.motionManager.motionGroups[motionGroup]?.length || 0;

                    if (motionCount > 0) {
                        const randomIndex = Math.floor(Math.random() * motionCount);
                        model.motion(motionGroup, randomIndex);
                        console.log(`Playing motion: ${motionGroup} at index ${randomIndex}`);
                    }
                });

                // Note: Cursor tracking (eye/head tracking) is handled automatically by pixi-live2d-display

                console.log("Model loaded successfully");
                // Mark as loaded for testing purposes
                window.__LIVE2D_LOADED__ = true;

            } catch (error) {
                console.error("Failed to load model:", error);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
