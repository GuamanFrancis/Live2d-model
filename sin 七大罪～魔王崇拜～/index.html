<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D PoC - Arquitectura de Referencia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <!-- PixiJS v6 -->
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script>window.PIXI = PIXI;</script>
    <!-- Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- pixi-live2d-display (Cubism 4+) -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <h2>Live2D PoC</h2>
        <p>Cargando modelo...</p>
    </div>

    <script>
        const { Application } = PIXI;
        const { Live2DModel } = PIXI.live2d;

        (async function main() {
            const app = new Application({
                resizeTo: window,
                autoDensity: true,
                resolution: window.devicePixelRatio || 1,
                backgroundColor: 0x333333,
            });

            document.getElementById('canvas-container').appendChild(app.view);

            try {
                // Configurar modelo y cargar
                const modelUrl = encodeURI('./xch001_01/xch001_01.model3.json');
                const model = await Live2DModel.from(modelUrl);

                // Inicializar interactividad
                model.interactive = true;
                model.buttonMode = true;

                // Añadir a la escena
                app.stage.addChild(model);

                // Función de redimensionamiento
                function resize() {
                    const scaleX = window.innerWidth / model.internalModel.width;
                    const scaleY = window.innerHeight / model.internalModel.height;

                    // Ajustar escala para que quepa en pantalla conservando proporción
                    const scale = Math.min(scaleX, scaleY) * 0.9;
                    model.scale.set(scale);

                    // Usar anchor para centrar si está disponible o posicionar manualmente
                    if(model.anchor) {
                        model.anchor.set(0.5, 0.5);
                        model.x = window.innerWidth / 2;
                        model.y = window.innerHeight / 2;
                    } else {
                        model.x = (window.innerWidth - model.internalModel.width * scale) / 2;
                        model.y = (window.innerHeight - model.internalModel.height * scale) / 2 + (model.internalModel.height * scale * 0.1);
                    }
                }

                // Ejecutar redimensionamiento inicial
                resize();
                window.addEventListener('resize', resize);

                // Manejar eventos de click/tap
                model.on('pointertap', () => {
                    // Intentar ejecutar animación del grupo por defecto ('') de forma aleatoria
                    // Opcionalmente se puede detectar zonas de hit si estuvieran configuradas
                    model.motion('', Math.floor(Math.random() * 3));
                });

                document.querySelector('#ui-layer p').innerText = "Modelo cargado. Haz clic para interactuar.";

            } catch (e) {
                console.error("Error al cargar el modelo:", e);
                document.querySelector('#ui-layer p').innerText = "Error: " + e.message;
            }
        })();
    </script>
</body>
</html>
