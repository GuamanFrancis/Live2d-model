<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC Live2D - sin 七大罪～魔王崇拜～</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #canvas-container {
            width: 800px;
            height: 800px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: #222;
        }
    </style>
    <!-- Cargar dependencias -->
    <!-- Live2D Cubism Core -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <!-- PixiJS v6 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/6.5.10/browser/pixi.min.js"></script>

    <script>
        // Exponer PIXI globalmente
        window.PIXI = PIXI;
    </script>

    <!-- Pixi Live2D Display -->
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <script>
        // Inicializar aplicación PixiJS
        const app = new PIXI.Application({
            width: 800,
            height: 800,
            backgroundColor: 0x222222,
            autoDensity: true,
            resolution: window.devicePixelRatio || 1,
        });

        document.getElementById('canvas-container').appendChild(app.view);

        async function initLive2D() {
            try {
                // Modelo extraído del juego (xch001_01)
                const modelPath = encodeURI("xch001_01/xch001_01.model3.json");
                console.log("Cargando modelo:", modelPath);

                // Cargar modelo
                const model = await PIXI.live2d.Live2DModel.from(modelPath);

                // Centrar modelo (ancla en el centro)
                model.anchor.set(0.5, 0.5);

                // Escalar el modelo basándose en sus dimensiones internas
                const scale = Math.min(
                    app.renderer.width / model.internalModel.width,
                    app.renderer.height / model.internalModel.height
                ) * 0.9; // 90% para dar algo de margen

                model.scale.set(scale);

                // Posicionar en el centro
                model.x = app.renderer.width / 2;
                model.y = app.renderer.height / 2;

                // Habilitar interactividad
                model.interactive = true;
                model.buttonMode = true;

                // Animaciones on-click
                model.on('pointerdown', () => {
                    console.log("Click detectado! Reproduciendo animación...");
                    model.motion('', 0); // Reproducir la primera animación del grupo por defecto ('')
                });

                // Añadir a la escena
                app.stage.addChild(model);
                console.log("Modelo cargado exitosamente");

            } catch (error) {
                console.error("Error al cargar el modelo:", error);
            }
        }

        // Ejecutar
        initLive2D();
    </script>
</body>
</html>
