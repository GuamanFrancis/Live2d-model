<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live2D SDK 4.0+ PoC</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
    <!-- Core dependencies -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
    <script>
        // Set global PIXI to avoid 'Live2DModel is undefined'
        window.PIXI = PIXI;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display/dist/cubism4.min.js"></script>
</head>
<body>
    <div id="canvas-container">
        <canvas id="live2d-canvas"></canvas>
    </div>

    <script>
        (async function main() {
            try {
                // Initialize PixiJS Application
                const app = new PIXI.Application({
                    view: document.getElementById('live2d-canvas'),
                    autoStart: true,
                    resizeTo: window,
                    transparent: true,
                    backgroundAlpha: 0 // Professional clear background
                });

                // Path to the target model
                const modelPath = encodeURI("xch001_01/xch001_01.model3.json");

                // Load the Live2D Model
                const model = await PIXI.live2d.Live2DModel.from(modelPath);

                // Add to stage
                app.stage.addChild(model);

                // Dynamic resizing function
                const resizeModel = () => {
                    // Use unscaled dimensions to calculate scale
                    const scaleX = innerWidth / model.internalModel.width;
                    const scaleY = innerHeight / model.internalModel.height;
                    const scale = Math.min(scaleX, scaleY) * 0.9;

                    model.scale.set(scale);

                    // Center the model
                    model.anchor.set(0.5, 0.5);
                    model.x = innerWidth / 2;
                    model.y = innerHeight / 2;
                };

                // Perform initial resize
                resizeModel();

                // Listen to window resize
                window.addEventListener('resize', () => {
                    resizeModel();
                });

                // Interaction setup (eye/head tracking is automatic out of the box)
                // Add explicit click listener for custom motions
                model.on('pointertap', () => {
                    // Trigger custom animation dynamically if available
                    model.motion('', 0);
                });

                console.log("Model initialized successfully.");

            } catch (error) {
                console.error("Error loading Live2D model:", error);
            }
        })();
    </script>
</body>
</html>
